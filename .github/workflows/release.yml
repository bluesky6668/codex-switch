name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build universal macOS package
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Verify packaged binaries
        run: |
          unzip -q dist/Codex-Switch-*-macOS-universal.zip -d .build/verify
          lipo -archs ".build/verify/Codex Switch ${GITHUB_REF_NAME#v}/codex-switch"
          lipo -archs ".build/verify/Codex Switch ${GITHUB_REF_NAME#v}/Codex Switch.app/Contents/MacOS/CodexSwitch"
          codesign --verify --deep --strict ".build/verify/Codex Switch ${GITHUB_REF_NAME#v}/Codex Switch.app"
          shasum -a 256 -c dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Codex-Switch-*-macOS-universal.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Codex-Switch-*-macOS-universal.zip \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "Codex Switch $GITHUB_REF_NAME" \
              --generate-notes
          fi
