name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要构建并上传的版本标签（例如 v0.2.1）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build universal macOS package
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Verify packaged binaries
        run: |
          unzip -q dist/Codex-Switch-*-macOS-universal.zip -d .build/verify
          lipo -archs ".build/verify/Codex Switch ${RELEASE_TAG#v}/codex-switch"
          lipo -archs ".build/verify/Codex Switch ${RELEASE_TAG#v}/Codex Switch.app/Contents/MacOS/CodexSwitch"
          codesign --verify --deep --strict ".build/verify/Codex Switch ${RELEASE_TAG#v}/Codex Switch.app"
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/Codex-Switch-*-macOS-universal.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/Codex-Switch-*-macOS-universal.zip \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "Codex Switch $RELEASE_TAG" \
              --generate-notes
          fi
